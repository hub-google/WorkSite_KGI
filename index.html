<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13263e">
  <title>職域經營平台｜WorkSite KGI</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #13263e; background:#f4f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; }
    header { background:#13263e; color:#fff; padding:20px clamp(20px,5vw,72px); font-weight:700; letter-spacing:.04em; }
    main { max-width:1000px; margin:auto; padding:clamp(32px,7vw,96px) 20px; }
    .eyebrow { color:#326ca8; font-weight:700; letter-spacing:.14em; }
    h1 { font-size:clamp(34px,5vw,56px); line-height:1.2; margin:12px 0 20px; }
    p { line-height:1.9; color:#52657a; font-size:17px; }
    .panel { margin-top:40px; padding:28px; background:white; border:1px solid #dce5f0; border-radius:18px; }
    .panel strong { color:#183955; }
    footer { color:#6a7b8c; font-size:13px; margin-top:50px; }
  </style>
</head>
<body>
  <header>WorkSite KGI</header>
  <main>
    <div class="eyebrow">WORKSITE MANAGEMENT PLATFORM</div>
    <h1>職域經營平台</h1>
    <p>職域經營平台的網站基礎環境已建立。後續將依據需求逐步加入管理功能、數據及操作流程。</p>
    <section class="panel" aria-label="開發狀態">
      <strong>平台建置中</strong>
      <p>目前為初始頁面，尚未匯入 Google Drive 資料，也尚未啟用任何實際業務功能。</p>
    </section>
    <footer>WorkSite KGI · Initial site</footer>
  </main>
</body>
</html>
