 LEVELS.slice(0,level+1).forEach((name,i)=>{if(i){const sep=document.createElement('span');sep.textContent='›';crumb.append(sep)}const b=document.createElement('button');b.textContent=i===0?'通路總計':path[i-1];b.disabled=i===level;b.onclick=()=>{path=path.slice(0,i);render()};crumb.append(b)});
 const cols=METRICS.filter(m=>VISIBLE.has(m[0]));const th=byId('thead');th.replaceChildren();const tr=document.createElement('tr');const first=document.createElement('th');first.textContent=['區域中心','業務區','通訊處','業務員'][level]||'業務員';tr.append(first);const dom=document.createElement('th');dom.textContent='職域';dom.style.textAlign='left';tr.append(dom);for(const [,label] of cols){const h=document.createElement('th');h.textContent=label;tr.append(h)}th.append(tr);
 const tbody=byId('tbody');tbody.replaceChildren();
 const names=[...new Set(matching.map(childName))];
 const rows=[];
 for(const name of names){
   const group=matching.filter(e=>childName(e)===name);
   for(const domain of DOMAINS)rows.push({name,domain,items:group.filter(e=>e.domain===domain)});
   rows.push({name,domain:'總計',items:group,subtotal:true});
 }
 for(const domain of DOMAINS)rows.push({name:'總計',domain,items:matching.filter(e=>e.domain===domain),grandGroup:true});
 rows.push({name:'總計',domain:'總計',items:matching,grandTotal:true});
 const frag=document.createDocumentFragment();
 for(let i=0;i<rows.length;i++){
   const row=rows[i],r=document.createElement('tr');
   if(row.subtotal)r.className='subtotal';
   else if(row.grandTotal)r.className='total';
   else if(row.grandGroup)r.className='grand-group';
   else if(i%5===0&&i>0)r.className='groupstart';
   if(row.grandGroup&&row.domain===DOMAINS[0]){
     const n=document.createElement('td');n.className='grand-org';n.rowSpan=5;n.textContent='總計';r.append(n);
   }else if(!row.grandGroup&&!row.grandTotal&&i%5===0){
     const n=document.createElement('td');n.className='org-cell';n.rowSpan=5;
     if(level<3){
       const button=document.createElement('button');button.className='orglink';button.textContent=row.name+' ↗';
       button.title='查看'+row.name+'的下一層';
       button.onclick=()=>{path.push(row.name);render();window.scrollTo({top:0,behavior:'smooth'})};n.append(button);
     }else{const title=document.createElement('strong');title.textContent=row.name;n.append(title)}
     const sub=document.createElement('span');sub.className='subline';sub.textContent=level===3?'示範業務員':'';if(level===3)n.append(sub);r.append(n);
   }
   const d=document.createElement('td');d.textContent=row.domain;d.style.textAlign='left';r.append(d);
   const values=sum(row.items);
   for(const [key] of cols){const cell=document.createElement('td');cell.textContent=fmt(values[key]);r.append(cell)}
   frag.append(r)
 }
 tbody.append(frag);
}
for(const [key,label] of METRICS){const wrap=document.createElement('label');const input=document.createElement('input');input.type='checkbox';input.checked=VISIBLE.has(key);input.onchange=()=>{if(input.checked)VISIBLE.add(key);else VISIBLE.delete(key);render()};wrap.append(input,document.createTextNode(label));byId('metricChecks').append(wrap)}
byId('metricBtn').onclick=()=>{const menu=byId('metricMenu');menu.hidden=!menu.hidden;byId('metricBtn').setAttribute('aria-expanded',String(!menu.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('.metricbox')){byId('metricMenu').hidden=true;byId('metricBtn').setAttribute('aria-expanded','false')}});
byId('apply').onclick=()=>{const a=byId('start').value,b=byId('end').value;if(!a||!b||a>b){alert('請選擇正確的日期區間');return}start=a;end=b;render()};
function toggleMenu(force){const mobile=window.matchMedia('(max-width:900px)').matches;if(mobile){const isOpen=force===undefined?!byId('sidebar').classList.contains('open'):force;byId('sidebar').classList.toggle('open',isOpen);byId('cover').classList.toggle('open',isOpen);byId('hamb').setAttribute('aria-expanded',String(isOpen))}else{const closed=force===undefined?!document.body.classList.contains('collapsed'):!force;document.body.classList.toggle('collapsed',closed);byId('hamb').setAttribute('aria-expanded',String(!closed))}}
byId('hamb').onclick=()=>toggleMenu();byId('cover').onclick=()=>toggleMenu(false);
for(const b of document.querySelectorAll('.nav')){b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');const name=b.dataset.view;byId('pagetitle').textContent=name;byId('performance').hidden=name!=='績效管理';byId('placeholder').hidden=name==='績效管理';byId('subtitle').textContent=name==='績效管理'?'組織績效總覽 · 逐層查看各職域經營成果':'此功能將依後續需求擴充';if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false)}}
render();
</script></body></html>
